<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="100%" role="img" aria-label="CS2 Esports Open-Source Ecosystem Architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-proto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="880" height="510" rx="12" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Left Panel: Live Production -->
    <rect x="24" y="20" width="420" height="316" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="234" y="54" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Live Production</text>

    <!-- Right Panel: Post-match Analysis -->
    <rect x="464" y="20" width="392" height="316" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="660" y="54" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">Post-match Analysis</text>

    <!-- Connectors (drawn behind nodes) -->
    <!-- CS2 GSI -> Mizar -->
    <path d="M 118 128 L 118 226" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <!-- GOTV -> Headless Observer -->
    <path d="M 332 128 L 332 152" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <!-- Headless Observer -> Mizar -->
    <path d="M 332 206 L 332 216 Q 332 222 326 222 L 166 222 Q 160 222 160 228 L 160 229" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <!-- Mizar <-> OBS Studio -->
    <path d="M 224 274 L 272 274" fill="none" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

    <!-- Demo Files -> DAK Studio -->
    <path d="M 564 128 L 564 212 Q 564 220 572 220 L 620 220 Q 628 220 628 228 L 628 231" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <!-- cs2-demo-format -> DAK Studio (dashed contract) -->
    <path d="M 756 128 L 756 212 Q 756 220 748 220 L 696 220 Q 688 220 688 228 L 688 231" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-proto)"/>

    <!-- Mizar <-> RivalHub -->
    <path d="M 134 316 L 134 410 Q 134 418 142 418 L 304 418" fill="none" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="150" y="372" fill="#475569" font-size="13" font-weight="500">Match Info &amp;</text>
    <text x="150" y="390" fill="#475569" font-size="13" font-weight="500">Live Events</text>

    <!-- DAK Studio -> RivalHub -->
    <path d="M 660 316 L 660 410 Q 660 418 652 418 L 576 418" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="676" y="372" fill="#475569" font-size="13" font-weight="500">Post-match Data</text>
    <text x="676" y="390" fill="#475569" font-size="13" font-weight="500">&amp; Round Facts</text>

    <!-- Nodes: Live Production -->
    <rect x="46" y="76" width="144" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="118" y="107" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="600">CS2 GSI</text>

    <rect x="252" y="76" width="160" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="332" y="107" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="600">GOTV Stream</text>

    <rect x="244" y="156" width="176" height="50" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="332" y="178" text-anchor="middle" fill="#581c87" font-size="13.5" font-weight="700">cs2-headless-observer</text>
    <text x="332" y="196" text-anchor="middle" fill="#581c87" font-size="11.5" opacity="0.85">Rust GOTV Client</text>

    <rect x="46" y="234" width="174" height="80" rx="14" fill="#e0f2fe" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="133" y="268" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Mizar</text>
    <text x="133" y="292" text-anchor="middle" fill="#475569" font-size="13">Broadcast &amp; HUD</text>

    <rect x="278" y="246" width="142" height="56" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="349" y="279" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="600">OBS Studio</text>

    <!-- Nodes: Post-match Analysis -->
    <rect x="488" y="76" width="152" height="52" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="564" y="107" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="600">Demo Files (.dem)</text>

    <rect x="676" y="76" width="158" height="52" rx="12" fill="#f3e8ff" stroke="#c084fc" stroke-width="1.5"/>
    <text x="755" y="99" text-anchor="middle" fill="#581c87" font-size="14" font-weight="700">cs2-demo-format</text>
    <text x="755" y="117" text-anchor="middle" fill="#581c87" font-size="11.5" opacity="0.85">ZIP Schema &amp; cs2df</text>

    <rect x="536" y="234" width="248" height="80" rx="14" fill="#e0f2fe" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="660" y="268" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">DAK Studio</text>
    <text x="660" y="292" text-anchor="middle" fill="#475569" font-size="13">Local Demo Workbench</text>

    <!-- Bottom Converging Node: RivalHub -->
    <rect x="310" y="378" width="260" height="80" rx="14" fill="#e0f2fe" stroke="#60a5fa" stroke-width="1.8"/>
    <text x="440" y="412" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="700">RivalHub</text>
    <text x="440" y="436" text-anchor="middle" fill="#475569" font-size="13.5">Tournament Operations</text>

    <!-- Legend -->
    <g transform="translate(274 486)">
      <circle cx="0" cy="-4" r="5" fill="#94a3b8"/>
      <text x="12" y="0" fill="#64748b" font-size="12.5">External</text>
      <circle cx="102" cy="-4" r="5" fill="#a855f7"/>
      <text x="114" y="0" fill="#64748b" font-size="12.5">Data &amp; Protocol</text>
      <circle cx="246" cy="-4" r="5" fill="#3b82f6"/>
      <text x="258" y="0" fill="#64748b" font-size="12.5">Flagship Products</text>
    </g>
  </g>
</svg>